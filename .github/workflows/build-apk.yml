name: Build APK

# DEV: run it from the Actions tab: "Build APK" -> "Run workflow" (unchanged), then download the APK.
# MAIN: every push builds the APK. The "release" job then waits for your approval (it uses the
# "production" environment, which must have you as a required reviewer; see README, "Releasing").
# When you approve it creates the CT<version> tag and a GitHub Release with the APK attached.
#
# Version numbers: the next one after the newest CT tag (CT2.3 -> 2.4 ... 2.9 -> 3.0), worked out here
# from the git tags and passed to Gradle, so dev and release builds always count upward together.
# Applies builder-base-support.patch and builder-base-icons.patch (if they are in the repo root),
# generates every Builder Base + per-level icon from the clash-of-clans-data package, runs the
# tests, and builds the debug APK.
on:
  workflow_dispatch:
    inputs:
      push_branch:
        description: "Also commit the patched code and icons to a branch named builder-base"
        type: boolean
        default: false
  push:
    branches: [main, builder-base]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the newest release

      - name: Work out the next version
        id: version
        run: |
          latest=$(git tag -l 'CT*' | sed -n 's/^CT\([0-9]\+\(\.[0-9]\+\)\?\)$/\1/p' | sort -V | tail -1)
          latest=${latest:-2.0}
          major=${latest%%.*}
          minor=0
          case "$latest" in *.*) minor=${latest#*.};; esac
          if [ "$minor" -ge 9 ]; then major=$((major + 1)); minor=0; else minor=$((minor + 1)); fi
          echo "Newest release tag: CT$latest -> building ${major}.${minor}"
          echo "version=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "tag=CT${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 100 + minor))" >> "$GITHUB_OUTPUT"

      - name: Apply patches (in order, if present and not applied yet)
        run: |
          for p in builder-base-support.patch builder-base-icons.patch; do
            if [ -f "$p" ]; then
              if git apply --check "$p" 2>/dev/null; then
                git apply "$p"
                echo "Applied $p"
              else
                echo "$p already applied or does not match; skipping."
              fi
            else
              echo "No $p found; skipping."
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate icons (Builder Base and every building level)
        run: |
          set -e
          mkdir -p /tmp/pkg && cd /tmp/pkg
          npm pack clash-of-clans-data@0.19.1
          tar xzf clash-of-clans-data-0.19.1.tgz
          mkdir -p /tmp/sharp && cd /tmp/sharp
          npm init -y >/dev/null
          npm i sharp
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/sharp/node_modules node tools/gen_icons.cjs /tmp/pkg/package
          ls app/src/main/assets/icons | wc -l

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashTrackers-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Commit patched code and icons to builder-base branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_branch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B builder-base
          rm -f builder-base-support.patch builder-base-icons.patch
          git add -A
          git commit -m "Add Builder Base timers and per-level icons" || echo "Nothing to commit"
          git push -f origin builder-base

  # Only for pushes to main. Waits for your approval (environment "production" with a required
  # reviewer), then tags the commit that was built and publishes the release with the APK.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # A newer push to main replaces an older release that is still waiting for approval.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ClashTrackers-debug-apk
          path: apk

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists (another release was published after this build). Re-run the build on main."
            exit 1
          fi
          mv apk/*.apk "apk/ClashTrackers-$TAG.apk"
          gh release create "$TAG" "apk/ClashTrackers-$TAG.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
