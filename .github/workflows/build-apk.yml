name: Build APK

# DEV: run it from the Actions tab: "Build APK" -> "Run workflow" (unchanged), then download the APK.
# MAIN: every push builds the APK. The "release" job then waits for your approval (it uses the
# "production" environment, which must have you as a required reviewer; see README, "Releasing").
# When you approve it creates the CT<version> tag and a GitHub Release with the APK attached.
#
# Version numbers: the next one after the newest CT tag (CT2.3 -> 2.4 ... 2.9 -> 3.0), worked out here
# from the git tags and passed to Gradle, so dev and release builds always count upward together.
# Applies builder-base-support.patch and builder-base-icons.patch (if they are in the repo root),
# runs the tests and builds the debug APK. Game data, names, times and pictures come from ClashKing
# (see tools/gen_*_ck.cjs and the weekly "Update game data" workflow); the icons in assets/icons are
# only the placeholders shown until the app has downloaded the current pictures.
on:
  workflow_dispatch:
    inputs:
      push_branch:
        description: "Also commit the patched code and icons to a branch named builder-base"
        type: boolean
        default: false
  push:
    branches: [main, builder-base]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the newest release

      - name: Work out the next version
        id: version
        run: |
          latest=$(git tag -l 'CT*' | sed -n 's/^CT\([0-9]\+\(\.[0-9]\+\)\?\)$/\1/p' | sort -V | tail -1)
          latest=${latest:-2.0}
          major=${latest%%.*}
          minor=0
          case "$latest" in *.*) minor=${latest#*.};; esac
          if [ "$minor" -ge 9 ]; then major=$((major + 1)); minor=0; else minor=$((minor + 1)); fi
          echo "Newest release tag: CT$latest -> building ${major}.${minor}"
          echo "version=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "tag=CT${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 100 + minor))" >> "$GITHUB_OUTPUT"

      - name: Apply patches (in order, if present and not applied yet)
        run: |
          for p in builder-base-support.patch builder-base-icons.patch; do
            if [ -f "$p" ]; then
              if git apply --check "$p" 2>/dev/null; then
                git apply "$p"
                echo "Applied $p"
              else
                echo "$p already applied or does not match; skipping."
              fi
            else
              echo "No $p found; skipping."
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PdevBuild=${{ github.ref != 'refs/heads/main' }} -PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.code }}

      # Main keeps the zipped artifact: the release job downloads it by name as a fallback.
      - name: Upload APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ClashTrackers-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Other branches (dev): the APK itself, not a zip, so it can be downloaded and installed directly.
      - name: Upload APK (not zipped)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          archive: false

      # Main only: the file that gets released is a RELEASE build (not debuggable). It is signed with the key in the
      # RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD secrets when
      # they exist; otherwise with the key earlier releases used, so it still installs over them. If this step fails the
      # release job falls back to the debug APK above, so a release is never blocked by it.
      - name: Build release APK (main only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          extra="-PreleaseWithDebugKey=true"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            dir="$RUNNER_TEMP/signing"; mkdir -p "$dir"
            echo "$KEYSTORE_B64" | base64 -d > "$dir/release.keystore"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$dir/release.keystore" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$dir/keystore.properties"
            extra="-PclashtimersSigning=$dir/keystore.properties"
            echo "Signing the release APK with the configured release key."
          else
            echo "No release key secrets; signing with the key earlier releases used."
          fi
          ./gradlew assembleRelease --stacktrace $extra -PdevBuild=false -PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ClashTrackers-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Commit patched code and icons to builder-base branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_branch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B builder-base
          rm -f builder-base-support.patch builder-base-icons.patch
          git add -A
          git commit -m "Add Builder Base timers and per-level icons" || echo "Nothing to commit"
          git push -f origin builder-base

  # Only for pushes to main. Waits for your approval (environment "production" with a required
  # reviewer), then tags the commit that was built and publishes the release with the APK.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # A newer push to main replaces an older release that is still waiting for approval.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        id: release_apk
        continue-on-error: true
        with:
          name: ClashTrackers-release-apk
          path: apk

      # Falls back to the debug APK when the release build did not produce a file.
      - uses: actions/download-artifact@v4
        if: steps.release_apk.outcome != 'success' || hashFiles('apk/*.apk') == ''
        with:
          name: ClashTrackers-debug-apk
          path: apk

      - name: Name the APK
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ls -l apk
          if ls apk/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::The release APK is unsigned and cannot be installed."; exit 1
          fi
          mv apk/*.apk "apk/ClashTrackers-$TAG.apk"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists (another release was published after this build). Re-run the build on main."
            exit 1
          fi
          gh release create "$TAG" "apk/ClashTrackers-$TAG.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      # VirusTotal scan of the released APK (tools/virustotal-scan.sh). It runs after the release is out, so a slow queue
      # never holds the release up, and its result is added to the release description. Nothing is added when the scan
      # could not finish (no key, upload failure, rate limit, timeout): an unfinished scan is never described as clean.
      - name: Scan the APK with VirusTotal
        continue-on-error: true
        timeout-minutes: 40
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: bash tools/virustotal-scan.sh "apk/ClashTrackers-$TAG.apk" "$TAG" security-report.txt

      - name: Add the scan result to the release description
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          [ -s security-report.txt ] || { echo "No scan report; the description is left as it is."; exit 0; }
          cat security-report.txt
          status=$(sed -n 's/^SCAN STATUS : //p' security-report.txt | head -1)
          counts=$(sed -n 's/^Detections  : //p' security-report.txt | head -1)
          flagged=${counts%% /*}
          engines=${counts##*/ }
          url=$(sed -n 's/^Report URL  : //p' security-report.txt | head -1)
          case "$status" in
            COMPLETED_CLEAN)
              line="VirusTotal scan: clean. None of the ${engines} security engines flagged this file. [View the full report](${url})" ;;
            COMPLETED_DETECTIONS)
              line="VirusTotal scan: ${flagged} of ${engines} security engines flagged this file. [View the full report](${url})" ;;
            *) echo "The scan did not finish; nothing is added to the description."; exit 0 ;;
          esac
          body=$(gh release view "$TAG" --json body -q .body)
          gh release edit "$TAG" --notes "${body}"$'\n\n'"${line}"
